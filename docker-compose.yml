version: '3.9'

# =============================================================================
# Feel Better — Entorno local de desarrollo
# =============================================================================
# Levanta todos los servicios de infraestructura en tu máquina.
# Úsalo con: docker compose up -d
# Para detener: docker compose down
# Para borrar datos: docker compose down -v
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — base de datos principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: feel-better-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feel_better
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — cache, sesiones y rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: feel-better-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — reemplaza Cloudflare R2 en local
  # Mismo protocolo S3 — el código no cambia entre local y producción.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: feel-better-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # Dashboard web → http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mailhog — captura emails en local (no envía de verdad)
  # Dashboard → http://localhost:8025
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: feel-better-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Dashboard web

volumes:
  postgres_data:
  redis_data:
  minio_data:
